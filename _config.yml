title: The Fairhaven Field Guide
description: A pressed-flower field guide & walkthrough for Wylde Flowers on Nintendo Switch — farming, witchcraft, romance, recipes, and every secret on Fairhaven Island.
url: "https://fairhavenfieldguide.com"
baseurl: ""
lang: en

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

twitter:
  card: summary_large_image

# AdSense ad units. The loader script in the layout serves nothing by
# itself; each slot below switches on its placement once it holds the
# data-ad-slot number of a display unit created in the AdSense account.
# Placement policy: _briefing/cowork-briefing.md → "Ad placement policy".
adsense:
  publisher: ca-pub-2065620637739110
  slots:
    footer: ""     # end-of-sheet unit on every page (except pages marked ads: false)
    incontent: ""  # mid-page unit, long reading pages only

defaults:
  - scope:
      path: ""
    values:
      layout: journal
      image: /assets/images/og-image-alt.jpg
