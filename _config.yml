title: The Fairhaven Field Guide
description: A pressed-flower field guide & walkthrough for Wylde Flowers on Nintendo Switch — farming, witchcraft, romance, recipes, and every secret on Fairhaven Island.
url: "https://fairhavenfieldguide.com"
baseurl: ""
lang: en

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      layout: journal
      image: /assets/images/og-image-alt.jpg
