<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ecdb">
  {% seo %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2065620637739110" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital@0;1&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/journal.css' | relative_url }}">
</head>
<body>
  <header class="journal-header">
    <a class="site-title" href="{{ '/' | relative_url }}">❀ The Fairhaven Field Guide ❀</a>
  </header>

  <main class="sheet">
    {% unless page.url == "/" %}
    <nav class="breadcrumb">
      <a href="{{ '/' | relative_url }}">← Table of Contents</a>
    </nav>
    {% endunless %}
    {{ content }}
  </main>

  <footer class="journal-footer">
    <div class="flourish">❦</div>
    <p>An unofficial fan guide, pressed with love.<br>
    <em>Wylde Flowers</em> is created by Studio Drydock.</p>
    <p class="footer-links">
      <a href="{{ '/privacy.html' | relative_url }}">Privacy Policy</a> ·
      <a href="{{ '/terms.html' | relative_url }}">Terms of Service</a>
    </p>
  </footer>
</body>
</html>
